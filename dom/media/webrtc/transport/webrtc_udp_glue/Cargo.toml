[package]
name = "webrtc_udp_glue"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[lib]
name = "webrtc_udp_glue"

[dependencies]
firefox-on-glean = { path = "../../../../../toolkit/components/glean/api" }
neqo-udp = { tag = "v0.22.2", git = "https://github.com/mozilla/neqo" }
# TODO: Enable "fast-apple-datapath" feature on neqo-udp for batch I/O on macOS.
neqo-common = { tag = "v0.22.2", git = "https://github.com/mozilla/neqo" }
log = { version = "0.4", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["ws2def", "winsock2"] }
